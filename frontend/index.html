<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система обліку кадрів</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Система обліку кадрів</h1>

        <form id="employee-form">
            <input type="text" id="fullname" placeholder="ПІБ працівника" required>
            <input type="text" id="position" placeholder="Посада" required>
            <input type="tel" id="phone" placeholder="Телефон" required>
            <input type="date" id="hireDate" required>
            <input type="number" id="salary" placeholder="Заробітна плата (грн)" required>
            <button type="submit">Додати працівника</button>
        </form>

        <table id="employee-table">
            <thead>
                <tr>
                    <td>ПІБ</td>
                    <td>Посада</td>
                    <td>Телефон</td>
                    <td>дата прийому</td>
                    <td>Зарплата</td>
                    <td>Дії</td>
                </tr>
            </thead>

            <tbody id="employee-list">

            </tbody>
        </table>
    </div>

    <script src="js/models.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
